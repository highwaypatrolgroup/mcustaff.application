.ulogo{width:84px;height:84px;flex:none;filter:drop-shadow(0 8px 18px var(--glow))}
.eyebrow{font:700 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.2em;color:var(--ac)}
h1{font-size:27px;line-height:1.1;margin:6px 0 0;letter-spacing:-.01em;background:var(--hg) 0 0/200% 100% text;-webkit-background-clip:text;color:transparent;animation:flow 7s linear infinite}
h2{font-size:17px;margin:0 0 6px}
.sub{color:var(--mu);margin:0 0 14px;font-size:14px}
.tick{display:flex;align-items:center;gap:8px;margin:14px 2px;font:600 11px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;color:var(--mu)}
.tick::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:blink 1.6s infinite}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:4px;padding:6px;border-radius:20px;background:var(--bar);backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:var(--sh);width:min(420px,calc(100% - 24px))}
.tab{flex:1;border:0;background:none;color:var(--mu);padding:10px 6px;border-radius:14px;font:600 13px system-ui;cursor:pointer;transition:.2s}
.tab.on{background:var(--g);color:var(--gt);box-shadow:0 6px 18px var(--glow)}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;transition:.15s}
.chip.on{background:var(--g);color:var(--gt);border-color:transparent;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:18px;margin-bottom:14px;animation:rise .45s ease both}
.card h2{display:flex;align-items:center;gap:10px;font-size:16px}
.logo{width:36px;height:36px;object-fit:contain}
.seat{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed var(--bd)}
.ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--ac2);border:1px solid var(--bd);display:grid;place-items:center}
.ic img{width:28px;height:28px;object-fit:contain}
.pt{flex:1;min-width:0}.pt b{display:block;font-size:14.5px;line-height:1.3}
.pill{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:6px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
.pill.op{background:var(--okb);color:var(--ok)}.pill.cl{background:var(--nob);color:var(--no)}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:18px;height:5px;border-radius:3px;background:var(--bd)}.pips i.o{background:var(--ok);box-shadow:0 0 8px var(--ok)}.pips i.f{background:var(--ac)}
label{display:block;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:16px 0 6px}
input[type=text],input[type=password],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;transition:.2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px var(--ac2)}
textarea{min-height:100px;resize:vertical}
.err{border-color:var(--no)!important}.em{color:var(--no);font-size:13px;margin-top:4px}
.opt{display:flex;gap:10px;align-items:flex-start;font:400 14px system-ui;letter-spacing:0;text-transform:none;color:var(--tx);margin:8px 0;padding:12px;border:1px solid var(--bd);border-radius:12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--ac);background:var(--ac2)}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px;margin-top:2px}
.btn{background:var(--g);color:var(--gt);border:0;padding:12px 20px;border-radius:12px;font:700 14px system-ui;cursor:pointer;margin-top:16px;box-shadow:0 8px 22px var(--glow);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.97)}
.btn.g{background:none;color:var(--tx);box-shadow:none;border:1px solid var(--bd)}
.btn.ok{background:linear-gradient(135deg,#16a34a,#22d3a0);color:#fff}.btn.no{background:linear-gradient(135deg,#dc2626,#fb7185);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.seat .btn{margin:0;padding:9px 16px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.prog{height:6px;border-radius:99px;background:var(--bd);overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;width:0;background:var(--g);border-radius:99px;transition:width .4s}
.badge{display:inline-block;padding:4px 11px;border-radius:6px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.b-pending{background:var(--peb);color:var(--pe)}.b-pass{background:var(--okb);color:var(--ok)}.b-fail{background:var(--nob);color:var(--no)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}.row:hover b{color:var(--ac)}
.ans{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd)}.ans p{margin:2px 0 10px;white-space:pre-wrap;word-break:break-word}.ans small{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.note{background:var(--ac2);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 4px;text-align:center;animation:rise .45s ease both}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--ac)}.stat small{color:var(--mu);font:600 10px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.step{display:flex;align-items:center;gap:10px}.step b{min-width:22px;text-align:center;font-size:20px}.step .btn{margin:0;padding:4px 13px;font-size:18px}
code{display:block;font:800 26px/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;user-select:all;margin:10px 0 14px;padding:16px;border-radius:14px;background:var(--bg);border:1px dashed var(--ac);color:var(--ac);text-align:center}
.tl{display:flex;margin:18px 0 6px}.tl .n{flex:1;text-align:center;position:relative;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.04em;color:var(--mu)}
.tl .n::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--bd)}.tl .n:first-child::before{display:none}
.tl .n.d::before{background:var(--ac)}.tl i{position:relative;display:block;width:20px;height:20px;margin:0 auto 6px;border-radius:50%;background:var(--card);border:2px solid var(--bd)}
.tl .d i{background:var(--ac);border-color:var(--ac)}.tl .d{color:var(--tx)}.tl .c i{box-shadow:0 0 0 5px var(--ac2),0 0 14px var(--glow)}.tl .c.pass i{background:var(--ok);border-color:var(--ok)}.tl .c.fail i{background:var(--no);border-color:var(--no)}
.msg{color:var(--mu);text-align:center;padding:30px 10px}
.cf{position:fixed;top:-20px;width:9px;height:15px;border-radius:2px;z-index:99;pointer-events:none;animation:fall linear forwards}
.view{animation:rise .4s ease both}
@media(max-width:420px){h1{font-size:23px}.ulogo{width:68px;height:68px}.hero{padding:14px;gap:12px}}
@media(prefers-reduced-motion:reduce){*,body::before{animation:none!important}}
.warn{background:var(--nob);color:var(--no);border:1px solid var(--no);border-radius:12px;padding:10px 12px;margin:12px 0 4px;font-size:13.5px}
.ev{margin:0 0 12px}.ev .btn{margin:0;padding:6px 20px;font-size:17px}.btn.dim{opacity:.3}
</style></head><body>

 return `<div class="card"><div class="acts" style="justify-content:space-between"><b>${POS[F.p]}</b><span class="sub" style="margin:0">Step ${S.step+1} of ${steps(S.form.p).length}</span></div><div class="sub" style="margin:0">${DET[F.d].n}</div><div class="prog"><i style="width:${(S.step+1)/steps(S.form.p).length*100}%"></i></div>${q.warn?AIW:""}<h2 style="margin-top:14px">${q.t}</h2>`+
 q.f.map(([k,l,t,o])=>t==="chk"?`<label class="opt"><input type="checkbox" data-k="${k}" ${F.a[k]?"checked":""}><span>${o}</span></label><div class="em" id="e-${k}"></div>`:`<label>${/^[me]\d/.test(k)?(+k.slice(1)+1)+". ":""}${l}${t==="ess"?" <small>(min. 2 sentences)</small>":""}</label>`+(t==="mc"?(F.ord[k]||(F.ord[k]=o.map((_,i)=>i).sort(()=>Math.random()-.5))).map(i=>`<label class="opt"><input type="radio" name="${k}" data-k="${k}" value="${i}" ${F.a[k]==i?"checked":""}><span>${o[i]}</span></label>`).join(""):t==="text"?`<input type="text" data-k="${k}" value="${esc(F.a[k]||"")}">`:t==="area"||t==="ess"?`<textarea data-k="${k}">${esc(F.a[k]||"")}</textarea>`:`<select data-k="${k}"><option value="">Select…</option>${o.map(x=>`<option ${F.a[k]===x?"selected":""}>${x}</option>`).join("")}</select>`)+`<div class="em" id="e-${k}"></div>`).join("")+
 `<div class="acts"><button class="btn g" id="back">${S.step?"← Back":"Cancel"}</button><button class="btn" id="next">${S.step===steps(S.form.p).length-1?"Submit application 🚀":"Continue →"}</button></div></div>`}
function vDone(){const a=S.done;return `<div class="card" style="text-align:center"><h2 style="justify-content:center">Application received ✅</h2><p class="sub">Save your tracking code. You will need it to check your result.</p><code>${a.id}</code><div class="acts" style="justify-content:center"><button class="btn" id="copy">Copy code</button><button class="btn g" id="trk">Track now</button></div></div>`}
const BADGE={pending:["pending","Pending review"],pass:["pass","Accepted ✓"],fail:["fail","Not selected"]};
function vTrack(){const a=S.found;return `<h2>Track your application</h2><p class="sub">Enter the code you received when you applied.</p><div class="card"><label style="margin-top:0">Tracking code</label><input type="text" id="code" placeholder="MCU-XXXXXX" autocapitalize="characters"><div class="em" id="e-code"></div><button class="btn" id="find">Check status</button></div>`+(a?`<div class="card"><div class="row" style="cursor:default"><div><b>${POS[a.p]}</b><div class="sub" style="margin:0">${DET[a.d].n}</div></div><span class="badge b-${BADGE[a.status][0]}">${BADGE[a.status][1]}</span></div>${tl(a.status)}<div class="note">${msg(a)}</div>${a.status!=="pending"?`<div class="note"><b>Your score:</b> ${score(a).all?score(a).tot+"/"+score(a).max:"Multiple choice "+score(a).mc+"/"+score(a).mt+" (essays still being checked)"}</div>`:""}${a.note?`<div class="note"><b>Staff note:</b> ${esc(a.note)}</div>`:""}</div>`:"")}
const msg=a=>({pending:"Your application is in the queue. This page refreshes automatically.",pass:`🎉 Congratulations, you passed! Our staff will contact you soon on Discord (${esc(a.a.discord||"your Discord")}). Please keep your DMs open.`,fail:"We’re truly sorry. Your application was not selected this time. Thank you for your effort and courage, and we encourage you to apply again in the future."})[a.status];
const tl=s=>`<div class="tl">${["Received","In review",s==="pass"?"Accepted":s==="fail"?"Declined":"Decision"].map((l,i)=>{const c=s==="pending"?1:2;return `<div class="n ${i<=c?"d":""} ${i===c?"c "+s:""}"><i></i>${l}</div>`}).join("")}</div>`;
function vEdit(){const k=S.eset,d=Q()[k];
 return `<div class="acts" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Edit questions</h2><button class="btn g" data-qx="done" style="margin:0">← Back</button></div><div class="chips" style="margin-top:12px">${[["dc","DCO / DXO"],["st","Unit staff"]].map(([x,l])=>`<button class="chip ${k===x?"on":""}" data-qs="${x}">${l}</button>`).join("")}</div><p class="sub">Edits save automatically and apply to new applicants. Past applications keep the questions they answered. Tap the round button beside an option to mark it as the correct answer.</p><h2>Multiple choice (${d.m.length})</h2>`+d.m.map((x,i)=>`<div class="card"><label style="margin-top:0">Question ${i+1}</label><textarea data-qe="m|${i}|q">${esc(x[0])}</textarea>${x[1].map((o,j)=>`<div class="opt" style="align-items:center"><input type="radio" name="c${k}${i}" data-qe="m|${i}|c|${j}" ${(x[2]||0)==j?"checked":""} title="Correct answer"><input type="text" data-qe="m|${i}|o|${j}" value="${esc(o)}"></div>`).join("")}<button class="btn no" data-qd="m|${i}" style="margin-top:8px;padding:8px 14px">Delete</button></div>`).join("")+`<button class="btn g" data-qa="m">+ Add multiple choice</button><h2 style="margin-top:22px">Essays (${d.e.length})</h2>`+d.e.map((x,i)=>`<div class="card"><label style="margin-top:0">Essay ${i+1}</label><textarea data-qe="e|${i}|q">${esc(x)}</textarea><button class="btn no" data-qd="e|${i}" style="margin-top:8px;padding:8px 14px">Delete</button></div>`).join("")+`<button class="btn g" data-qa="e">+ Add essay</button><div class="acts" style="margin-top:14px"><button class="btn g" id="seed">Load starter questions (one time)</button></div>`}
function vKeys(){const K=KEYS();return `<div class="acts" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Staff accounts</h2><button class="btn g" data-kx="1" style="margin:0">← Back</button></div><p class="sub">Create a staff login or revoke one. A revoked account loses access right away.</p><div class="card"><label style="margin-top:0">Add a staff account</label><input type="text" id="kl" placeholder="Name / label"><input type="text" id="ke" placeholder="Email" style="margin-top:8px" autocapitalize="none"><input type="text" id="kp" placeholder="Password (min. 6 characters)" style="margin-top:8px" autocomplete="off"><div class="em" id="e-k"></div><div class="acts"><button class="btn" id="kadd">Create &amp; whitelist</button><button class="btn g" id="kgen">Generate</button></div></div><h2>Whitelisted (${K.length})</h2>`+(K.length?K.map(k=>`<div class="card"><div class="row" style="cursor:default"><div><b>${esc(k.label)}</b><div class="sub" style="margin:0">${esc(k.id)}</div></div><button class="btn no" data-kr="${k.id}" style="margin:0">Revoke</button></div></div>`).join(""):`<div class="msg">No staff accounts yet.</div>`)}
function vLogin(){return `<h2>Staff login</h2><p class="sub">Authorized command staff only.</p><div class="card"><label style="margin-top:0">Email</label><input type="text" id="em" autocapitalize="none" autocomplete="username"><label>Password</label><input type="password" id="pw" autocomplete="current-password"><div class="em" id="e-pw">${S.msg||""}</div><button class="btn" id="login">Enter 🔒</button></div>`}
function vDash(){const A=apps();A.forEach(ensure);const c=k=>A.filter(a=>a.status===k).length,L=A.filter(a=>S.filter==="all"||a.status===S.filter);
 return `<div class="acts" style="margin-bottom:12px"><button class="btn" id="eq" style="margin:0">✏️ Edit questions &amp; answers</button>${S.admin?`<button class="btn g" id="ak" style="margin:0">🔑 Manage staff accounts</button>`:""}</div><div class="stats">${[["Total",A.length],["Pending",c("pending")],["Accepted",c("pass")],["Declined",c("fail")]].map(([l,n])=>`<div class="stat"><b>${n}</b><small>${l}</small></div>`).join("")}</div>
 <div class="chips">${["all","pending","pass","fail"].map(f=>`<button class="chip ${S.filter===f?"on":""}" data-f="${f}">${f==="all"?"All":BADGE[f][1]}</button>`).join("")}</div>`+
 (L.length?L.map(a=>`<div class="card"><div class="row" data-o="${a.id}"><div><b>${esc(a.a.roblox||a.a.name||"—")}</b><div class="sub" style="margin:0">${POS[a.p]} · ${a.d==="tiger"?"Tiger":"Eagle"} · ${a.id} · ${score(a).all?score(a).tot+"/"+score(a).max:"MC "+score(a).mc+"/"+score(a).mt}</div></div><span class="badge b-${BADGE[a.status][0]}">${BADGE[a.status][1]}</span></div>`+(S.open===a.id?`<div class="ans">${ansHtml(a)}<label style="margin-top:6px">Note to applicant</label><input type="text" data-n="${a.id}" value="${esc(a.note||"")}"><div class="acts"><button class="btn ok" data-d="${a.id}|pass" ${a.status!=="pass"&&!left(a.d,a.p)?"disabled":""}>Accept</button><button class="btn no" data-d="${a.id}|fail">Decline</button><button class="btn g" data-d="${a.id}|pending">Reset</button></div></div>`:"")+`</div>`).join(""):`<div class="msg">No applications here yet.</div>`)+
 `<div class="card"><h2>Seat management</h2>${Object.keys(DET).map(d=>`<small class="sub"><b>${DET[d].n}</b></small>${Object.keys(POS).map(p=>`<div class="seat"><div class="pt"><b>${POS[p]}</b><span class="sub" style="margin:0">${taken(d,p)} filled</span></div><div class="step"><button class="btn" data-s="${d}|${p}|-1">−</button><b>${seats()[d][p]}</b><button class="btn" data-s="${d}|${p}|1">+</button></div></div>`).join("")}`).join("")}</div><div class="acts"><button class="btn g" id="exp">Export JSON</button><button class="btn g" id="out">Log out</button></div>`}
function validate(){const q=steps(S.form.p)[S.step];let ok=true;q.f.forEach(([k,,t])=>{const v=S.form.a[k],el=$(`[data-k="${k}"]`),bad=t==="chk"?!v:t==="mc"?v===undefined:t==="ess"?String(v||"").split(/[.!?]+/).filter(s=>s.trim().split(/\s+/).filter(Boolean).length>=2).length<2:!v||(t!=="sel"&&String(v).trim().length<(t==="area"?15:2));$("#e-"+k).textContent=bad?(t==="chk"?"You must agree to continue.":t==="mc"?"Please select an answer.":t==="ess"?"Write at least 2 full sentences.":t==="area"?"Please write a little more (15+ characters).":"This field is required."):"";el.classList.toggle("err",bad&&t!=="chk"&&t!=="mc");if(bad)ok=false});return ok}
document.addEventListener("input",e=>{const k=e.target.dataset.k;if(k&&S.form)S.form.a[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;if(e.target.dataset.n){const a=apps();a.find(x=>x.id===e.target.dataset.n).note=e.target.value;st.set("mcu_apps",a)}});
document.addEventListener("click",e=>{const t=e.target.closest("button,.row");if(!t)return;const D=t.dataset;
 if(D.t){S.tab=D.t;S.form=null;S.done=null;render();}
 else if(D.ap){const[d,p]=D.ap.split("|");S.form={d,p,a:{},ord:{}};S.step=0;render();scrollTo({top:0,behavior:"smooth"})}
 else if(t.id==="back"){if(S.step)S.step--;else S.form=null;render()}
 else if(t.id==="next"){if(!validate())return;if(S.step<steps(S.form.p).length-1){S.step++;render();return}
  const F=S.form,id="MCU-"+Math.random().toString(36).slice(2,10).toUpperCase(),q=Q()[F.p==="staff"?"st":"dc"],a={id,d:F.d,p:F.p,a:F.a,paste:F.paste||0,ev:{},status:"pending",note:"",at:Date.now()};t.disabled=true;Promise.all([setDoc(doc(db,"applications",id),{...a,q:sq(q)}),setDoc(doc(db,"results",id),{p:a.p,d:a.d,status:"pending",note:"",discord:a.a.discord||""})]).then(()=>{S.done=a;S.form=null;render();confetti()}).catch(()=>{t.disabled=false;t.textContent="Failed. Tap to retry"})}
 else if(t.id==="copy"){try{navigator.clipboard.writeText(S.done.id)}catch(x){}t.textContent="Copied ✓"}
 else if(t.id==="trk"){S.tab="track";S.found=S.done;S.done=null;render()}
 else if(t.id==="find"){const c=$("#code").value.trim().toUpperCase();getDoc(doc(db,"results",c)).then(s=>{const d=s.exists()&&s.data();S.found=d?{id:c,...d,a:{discord:d.discord}}:null;render();if(!d)$("#e-code").textContent="No application found with that code."}).catch(()=>{S.found=null;render();$("#e-code").textContent="Couldn’t check right now. Please try again."})}
 else if(t.id==="login"){const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;$("#e-pw").textContent="";signInWithEmailAndPassword(auth,em,pw).catch(()=>{$("#e-pw").textContent="Incorrect email or password."})}
 else if(t.id==="out"){signOut(auth)}
 else if(t.id==="exp"){const b=new Blob([JSON.stringify(apps(),null,2)],{type:"application/json"});const u=URL.createObjectURL(b);navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(apps())).catch(()=>{});t.textContent="Copied to clipboard ✓"}
 else if(t.id==="ak"){S.keys=true;render();scrollTo(0,0)}
 else if(D.kx){S.keys=false;render()}
 else if(t.id==="kgen"){$("#kp").value="MCU-"+Math.random().toString(36).slice(2,8).toUpperCase()}
 else if(t.id==="kadd"){const l=$("#kl").value.trim(),em=$("#ke").value.trim().toLowerCase(),p=$("#kp").value,m=!l?"Enter a label.":!/^\S+@\S+\.\S+$/.test(em)?"Enter a valid email.":p.length<6?"Password must be at least 6 characters.":"";if(m){$("#e-k").textContent=m;return}t.disabled=true;addStaff(l,em,p).then(()=>{S.keys=true;render()}).catch(()=>{t.disabled=false;$("#e-k").textContent="Couldn’t create the account."})}
 else if(D.kr){if(D.arm){deleteDoc(doc(db,"staff",D.kr))}else{t.dataset.arm=1;t.textContent="Tap to confirm"}}
 else if(t.id==="seed"){t.textContent="Loading…";fetch("starter-questions.json").then(r=>r.json()).then(D=>{const Z={};for(const k of["dc","st"])Z[k]={m:D[k].m.map(x=>{const o=x[1].map((_,i)=>i).sort(()=>Math.random()-.5);return[x[0],o.map(i=>x[1][i]),o.indexOf(0)]}),e:D[k].e};st.set("mcu_q",Z);render()}).catch(()=>{t.textContent="starter-questions.json not found"})}
 else if(t.id==="eq"){S.edit=true;S.eset="dc";render();scrollTo(0,0)}
 else if(D.qs){S.eset=D.qs;render()}
 else if(D.qx){if(D.qx==="done"){S.edit=false;render()}else if(D.arm){st.set("mcu_q",DEFQ());render()}else{t.dataset.arm=1;t.textContent="Tap again to confirm"}}
 else if(D.qa||D.qd){const Z=JSON.parse(JSON.stringify(Q())),d=Z[S.eset];if(D.qa){D.qa==="m"?d.m.push(["New question",["Correct answer","Option B","Option C","Option D"],0]):d.e.push("New essay question")}else{const[w,i]=D.qd.split("|");(w==="m"?d.m:d.e).splice(+i,1)}st.set("mcu_q",Z);const y=scrollY;render();scrollTo(0,y)}
 else if(D.f){S.filter=D.f;render()}
 else if(D.o){S.open=S.open===D.o?null:D.o;render()}
 else if(D.v){const[id,k,v]=D.v.split("|"),A=apps(),a=A.find(x=>x.id===id),y=scrollY;a.ev=a.ev||{};a.ev[k]=+v;st.set("mcu_apps",A);render();scrollTo(0,y)}
 else if(D.d){const[id,s]=D.d.split("|"),A=apps(),a=A.find(x=>x.id===id);a.status=s;st.set("mcu_apps",A);render();if(s==="pass")confetti()}
 else if(D.s){const[d,p,n]=D.s.split("|"),X=JSON.parse(JSON.stringify(seats()));X[d][p]=Math.max(0,X[d][p]+ +n);st.set("mcu_seats",X);render()}});
document.addEventListener("input",e=>{const q=e.target.dataset.qe;if(!q)return;const[w,i,f,j]=q.split("|"),Z=JSON.parse(JSON.stringify(Q())),d=Z[S.eset];if(w==="m"){const x=d.m[i];if(f==="q")x[0]=e.target.value;else if(f==="o")x[1][j]=e.target.value;else x[2]=+j}else d.e[i]=e.target.value;st.set("mcu_q",Z)});
document.addEventListener("paste",e=>{if(S.form&&e.target.tagName==="TEXTAREA")S.form.paste=(S.form.paste||0)+1});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="pw")$("#login").click();if(e.key==="Enter"&&e.target.id==="code")$("#find").click()});
setInterval(()=>{if(S.tab==="track"&&S.found&&!/INPUT/.test(document.activeElement.tagName))getDoc(doc(db,"results",S.found.id)).then(s=>{if(s.exists()&&s.data().status!==S.found.status){S.found={id:S.found.id,...s.data(),a:{discord:s.data().discord}};render()}}).catch(()=>{})},4000);
render();
</script></body></html>
